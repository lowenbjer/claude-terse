name: Post your worst reply
description: A reply that broke the rules with the plugin installed. Replies feed the rules and the benchmark.
title: "Reply: <first five words>"
labels: [reply]
body:
  - type: input
    id: model
    attributes:
      label: Model
      description: The model id from /status or from the status line.
      placeholder: claude-opus-5-5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: turn
    attributes:
      label: Turn number in the session
      description: A rough count is fine. Turn 1 and turn 30 fail differently.
      placeholder: "12"
  - type: textarea
    id: reply
    attributes:
      label: The reply
      description: Paste it as written. Remove names and secrets.
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Which rules it broke
      description: Rule numbers from rules/RULES.md, or a sentence.
